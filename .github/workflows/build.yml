name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go version
      - run: go test ./...
      - run: go vet ./...

  coredns:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: coredns/coredns
          ref: v1.14.6
          path: coredns
      - run: go version
      - name: Register plugin
        working-directory: coredns
        run: |
          sed -i '/^forward:forward/i meshroute:github.com/CAceZhou/coredns-meshroute' plugin.cfg
          go generate
          go mod edit -require=github.com/CAceZhou/coredns-meshroute@v0.0.0
          go mod edit -replace=github.com/CAceZhou/coredns-meshroute=${GITHUB_WORKSPACE}
          go mod tidy
      - name: Build CoreDNS targets
        working-directory: coredns
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/coredns-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/coredns-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: coredns-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
