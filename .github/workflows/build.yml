name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  coredns:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: coredns-linux-amd64
          - goos: linux
            goarch: arm64
            output: coredns-linux-arm64
          - goos: windows
            goarch: amd64
            output: coredns-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            output: coredns-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: coredns/coredns
          ref: v1.14.6
          path: coredns
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Register plugin
        working-directory: coredns
        run: |
          sed -i '/^forward:forward/i meshroute:github.com/CAceZhou/coredns-meshroute' plugin.cfg
          go generate
          go mod edit -require=github.com/CAceZhou/coredns-meshroute@v0.0.0
          go mod edit -replace=github.com/CAceZhou/coredns-meshroute=${GITHUB_WORKSPACE}
          go mod tidy
      - name: Build CoreDNS
        working-directory: coredns
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o ../dist/${{ matrix.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
